[project]
name = "rankengine"
version = "1.0.0"
description = "Simple SEO analysis engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "motor>=3.4.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "neo4j>=5.24.0",
    "groq>=0.5.0",
    "jinja2>=3.1.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "pymupdf>=1.24.0",
    "python-magic>=0.4.27",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
