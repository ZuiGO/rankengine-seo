version: "3.8"

# RankEngine WordPress Sandbox — Phase 1A
# SEO plugin: Yoast SEO (fingerprinted from fluidcontrols.com wp-json namespaces)
# Exposed publicly via nginx Basic Auth only (port 8091).
# Raw WordPress port (8090) is intentionally NOT published for external access.

services:
  db:
    image: mariadb:10.6
    container_name: rankengine_wp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wp_internal

  wordpress:
    image: wordpress:latest
    container_name: rankengine_wp
    depends_on:
      - db
    # Port 8090 is intentionally kept internal (accessible only via nginx-basicauth on 8091).
    # Un-comment for direct admin access during development ONLY:
    # ports:
    #   - "8090:80"
    expose:
      - "80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppassword
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
      # Sandbox-specific config injected at container startup
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISALLOW_FILE_EDIT', true);
        define('WP_DEBUG', false);
    volumes:
      - wp_data:/var/www/html
      - ./robots.txt:/var/www/html/robots.txt:ro
    networks:
      - wp_internal

  wpcli:
    image: wordpress:cli
    container_name: rankengine_wpcli
    depends_on:
      - db
      - wordpress
    volumes:
      - wp_data:/var/www/html
      - ./provision.sh:/provision.sh:ro
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppassword
      WORDPRESS_DB_NAME: wordpress
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    user: xfs
    # One-shot: runs provision.sh and exits.
    entrypoint: ["/bin/sh", "/provision.sh"]
    restart: "no"
    networks:
      - wp_internal

  nginx-basicauth:
    image: nginx:1.25-alpine
    container_name: rankengine_wp_proxy
    depends_on:
      - wordpress
    ports:
      - "8091:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - wp_internal

volumes:
  db_data:
  wp_data:

networks:
  wp_internal:
    driver: bridge
