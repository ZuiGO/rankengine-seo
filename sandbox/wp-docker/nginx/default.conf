server {
    listen 80;
    server_name localhost;

    # HTTP Basic Auth — guards the entire sandbox from public access
    auth_basic "RankEngine Sandbox";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Proxy everything to the WordPress container
    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host:8091;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WordPress needs to know the real port for redirect generation
        proxy_redirect http://wordpress:80/ http://localhost:8091/;
        client_max_body_size 64M;
    }

    # WP REST API — same auth, just ensuring JSON responses pass through cleanly
    location /wp-json/ {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host:8091;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept application/json;
        proxy_redirect http://wordpress:80/ http://localhost:8091/;
    }
}
